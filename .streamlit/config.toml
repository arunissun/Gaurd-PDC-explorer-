[theme]
# Light interface base (warm neutral). The dark interface theme is applied per
# browser session by dashboard/components.py; figures set their own colours.
base = "light"
primaryColor = "#A45A45"
backgroundColor = "#F5F2ED"
secondaryBackgroundColor = "#FFFEFB"
textColor = "#2D2A28"
borderColor = "#E2DDD6"
baseRadius = "0.625rem"
# Keep "sans-serif": Streamlit also writes this font into Plotly text, so changing
# it would change every figure. The interface font is set in components.py.
font = "sans-serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
